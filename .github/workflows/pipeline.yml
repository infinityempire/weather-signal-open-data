name: Collect AI and cloud status signals and trigger Netlify

on:
  schedule:
    - cron: '15 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-stability-collection
  cancel-in-progress: false

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect official AI and cloud status feeds
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CACHE_TTL_SECONDS: '604800'
        run: node src/collect.js
      - name: Trigger Netlify production build
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$NETLIFY_BUILD_HOOK_URL"
      - name: Explain skipped Netlify deployment
        if: ${{ env.NETLIFY_BUILD_HOOK_URL == '' }}
        run: echo "NETLIFY_BUILD_HOOK_URL is not configured; collection completed but no Netlify rebuild was triggered."
